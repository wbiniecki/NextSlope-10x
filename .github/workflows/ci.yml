name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # GitHub-hosted ubuntu-latest ships Docker, so the Testcontainers Postgres
      # test (UserRepositoryPostgresTests) runs here — this step gates every schema
      # migration against a real Postgres engine, not just local H2.
      - name: Run tests (incl. Testcontainers Postgres migration verification)
        run: ./gradlew test --no-daemon
