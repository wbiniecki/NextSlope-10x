name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # GitHub-hosted ubuntu-latest ships Docker, so the Testcontainers Postgres
      # test (UserRepositoryPostgresTests) runs here — this step gates every schema
      # migration against a real Postgres engine, not just local H2.
      - name: Run tests (incl. Testcontainers Postgres migration verification)
        run: ./gradlew test --no-daemon

      # Mutation gate scoped to com.nextslope.recommendation.* (test-plan.md §5). Fails the
      # build if the recommendation engine's mutation score drops below the calibrated
      # threshold, catching weak/tautological assertions in the scorer/filter/rationale logic.
      - name: Mutation gate (PIT, recommendation engine only)
        run: ./gradlew pitest --no-daemon

      # Deterministic browser provisioning for the e2e smoke tier: installs Chromium plus
      # its Linux system dependencies via Playwright's CLI. Deliberately no cache of
      # ~/.cache/ms-playwright — Playwright's guidance notes cache restoration is often
      # comparable to downloading, and the Linux system dependencies aren't cacheable.
      - name: Install Playwright Chromium (+ OS dependencies)
        run: ./gradlew playwrightInstall --no-daemon

      # Blocking browser smoke gate (test-plan.md §3 Phase 3 / §5): boots the app on a
      # random port and drives headless Chromium through the chained HTMX journey that
      # MockMvc structurally can't see (recommend fragment swap, visited-toggle swap +
      # row highlight). Headless is Playwright's default — no xvfb needed.
      - name: Browser e2e smoke (headless Chromium)
        run: ./gradlew e2eTest --no-daemon
