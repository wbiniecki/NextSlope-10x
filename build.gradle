plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	// Mutation testing, scoped to the recommendation engine only (test-plan.md §5/§6.5).
	id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'com.nextslope'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	implementation 'org.apache.commons:commons-csv:1.14.1'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-h2console'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Browser e2e smoke tier (test-plan.md §3 Phase 3 / §6.6): an isolated source set so
// Playwright and the browser-driven journey never touch (or slow down) `./gradlew test`.
// Compile/runtime classpaths extend the test output to reuse fixtures (UserFixtures).
sourceSets {
	e2eTest {
		java.srcDirs = ['src/e2eTest/java']
		resources.srcDirs = ['src/e2eTest/resources']
		compileClasspath += sourceSets.main.output + sourceSets.test.output
		runtimeClasspath += sourceSets.main.output + sourceSets.test.output
	}
}

configurations {
	e2eTestImplementation.extendsFrom testImplementation
	// Inherits testRuntimeOnly (JUnit Platform launcher) which in turn inherits the
	// application runtimeOnly dependencies (H2 driver) via the java plugin hierarchy.
	e2eTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
	// Scoped to e2eTestImplementation only so Playwright never leaks onto the unit-test classpath.
	e2eTestImplementation 'com.microsoft.playwright:playwright:1.61.0'
}

// Deliberately NOT wired into `check`/`build`: the browser suite runs only when invoked
// explicitly (`./gradlew e2eTest` locally, or its own blocking CI step).
tasks.register('e2eTest', Test) {
	description = 'Runs the browser-driven e2e smoke suite (headless Chromium via Playwright).'
	group = 'verification'
	testClassesDirs = sourceSets.e2eTest.output.classesDirs
	classpath = sourceSets.e2eTest.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter tasks.named('test')
}

// Deterministic browser provisioning for CI: installs Chromium plus its Linux system
// dependencies. Locally this is optional — Playwright auto-downloads on first run.
tasks.register('playwrightInstall', JavaExec) {
	description = 'Installs the Chromium browser (and OS dependencies) used by e2eTest.'
	group = 'verification'
	classpath = sourceSets.e2eTest.runtimeClasspath
	mainClass = 'com.microsoft.playwright.CLI'
	args 'install', '--with-deps', 'chromium'
}

// PIT mutation gate — scoped strictly to the recommendation engine (scorer / filter / rationale),
// never repo-wide (test-plan.md §5 quality gates, §6.5 cookbook, §7 deliberate exclusion). The
// branch-heavy scoring, hard-filter, and truthfulness logic is the one place a surviving mutant
// carries real signal; the auth/web/config surfaces are guarded by cheaper slice tests.
//
// Test scope excludes the @SpringBootTest privacy integration test so every mutant is killed by the
// fast plain-JUnit unit tests (no Spring context boot per mutant). mutationThreshold is calibrated
// empirically from the first green run, not preset (test-plan.md §5).
pitest {
	junit5PluginVersion = '1.2.3'
	targetClasses = ['com.nextslope.recommendation.*']
	targetTests = ['com.nextslope.recommendation.*']
	excludedTestClasses = ['com.nextslope.recommendation.RecommendationOwnershipIntegrationTests']
	timestampedReports = false
	threads = 2
	mutationThreshold = 90
}

// Local dev runs under the `local` profile so the app uses a file-backed H2
// (see application-local.properties) and data survives restarts. Override with
// `-Dspring.profiles.active=...` if needed. Tests/CI use the in-memory default.
tasks.named('bootRun') {
	systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active', 'local')
}
