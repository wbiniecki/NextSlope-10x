<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Something went wrong | NextSlope</title>
	<link rel="stylesheet"
		  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		  crossorigin="anonymous">
</head>
<body class="bg-light">
	<main class="container py-5">
		<div class="row justify-content-center">
			<div class="col-lg-6 text-center">
				<h1 class="display-1 fw-bold text-secondary" th:text="${status} ?: 'Error'">Error</h1>
				<p class="lead mb-1" th:text="${error} ?: 'Something went wrong'">Something went wrong</p>
				<p class="text-muted">Please try again, or head back to the home page.</p>
				<a class="btn btn-primary mt-3" th:href="@{/}" href="/">Back to home</a>
			</div>
		</div>
	</main>
</body>
</html>
