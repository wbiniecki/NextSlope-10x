<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="_csrf" th:content="${_csrf.token}">
	<meta name="_csrf_header" th:content="${_csrf.headerName}">
	<title th:text="${title} ?: 'NextSlope'">NextSlope</title>
	<link rel="stylesheet"
		  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		  crossorigin="anonymous">
</head>
<body>
	<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container">
			<a class="navbar-brand fw-bold" th:href="@{/resorts}" href="/resorts">NextSlope</a>
			<div class="d-flex align-items-center" sec:authorize="isAuthenticated()">
				<a class="btn btn-outline-light btn-sm me-3" sec:authorize="hasRole('ADMIN')"
				   th:href="@{/admin/resorts}" href="/admin/resorts">Admin</a>
				<a class="btn btn-outline-light btn-sm me-3" th:href="@{/profile}" href="/profile">Profile</a>
				<span class="navbar-text me-3">
					Signed in as <span sec:authentication="name">user</span>
				</span>
				<form th:action="@{/logout}" method="post" class="d-inline">
					<button type="submit" class="btn btn-outline-light btn-sm">Sign out</button>
				</form>
			</div>
		</div>
	</nav>

	<th:block th:fragment="scripts">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
				integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
				crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"
				integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
				crossorigin="anonymous"></script>
		<script>
			// Spring CSRF is enabled and pinned; HTMX sends no token by default. Copy the token
			// (published as <meta> tags) into every HTMX request's headers. Canonical wiring reused by S-05.
			(function () {
				var tokenMeta = document.querySelector('meta[name="_csrf"]');
				var headerMeta = document.querySelector('meta[name="_csrf_header"]');
				if (tokenMeta && headerMeta) {
					document.body.addEventListener('htmx:configRequest', function (evt) {
						evt.detail.headers[headerMeta.content] = tokenMeta.content;
					});
				}
				// In-place visited-row highlight: when a toggle button swaps in, derive its row's
				// highlight from the button's own data-visited (single source of truth) — never by
				// replacing the <tr>, which would wipe its cells. Read evt.target (the freshly
				// swapped-in button the event is dispatched on); evt.detail.target is the original
				// pre-swap button, which outerHTML detaches from the DOM — its closest('tr') is null.
				document.body.addEventListener('htmx:afterSwap', function (evt) {
					var button = evt.target;
					if (button && button.classList && button.classList.contains('visited-toggle')) {
						var row = button.closest('tr');
						if (row) {
							row.classList.toggle('table-active', button.dataset.visited === 'true');
						}
					}
				});
			})();
		</script>
	</th:block>
</body>
</html>
