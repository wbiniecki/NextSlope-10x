<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('NextSlope')}"></head>
<body class="bg-light">
	<main class="container py-5">
		<div class="row justify-content-center">
			<div class="col-lg-8 text-center">
				<div th:if="${param.logout}" class="alert alert-success" role="alert">
					You've been signed out.
				</div>

				<div th:if="${param.deleted}" class="alert alert-success" role="alert">
					Your account has been deleted.
				</div>

				<h1 class="display-4 fw-bold mb-3">NextSlope</h1>
				<p class="lead text-secondary mb-4">
					Find three ski resorts that match how you actually ski.
				</p>
				<p class="text-muted">
					Set your preferences, then get three resorts picked just for you.
				</p>

				<div sec:authorize="isAuthenticated()" class="mt-3">
					<p class="text-secondary mb-3">
						Signed in as <span sec:authentication="name">user</span>
					</p>
					<a class="btn btn-primary btn-lg me-2" th:href="@{/resorts}" href="/resorts">Browse resorts</a>
					<a class="btn btn-outline-primary btn-lg me-2" sec:authorize="hasRole('ADMIN')"
					   th:href="@{/admin/resorts}" href="/admin/resorts">Manage resorts</a>
					<form th:action="@{/logout}" method="post" class="d-inline">
						<button type="submit" class="btn btn-outline-secondary btn-lg">Sign out</button>
					</form>
				</div>

				<div sec:authorize="!isAuthenticated()" class="mt-3">
					<a class="btn btn-primary btn-lg me-2" th:href="@{/login}" href="/login">Sign in</a>
					<a class="btn btn-outline-primary btn-lg" th:href="@{/signup}" href="/signup">Create account</a>
				</div>
			</div>
		</div>
	</main>

	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
