<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Create account — NextSlope</title>
	<link rel="stylesheet"
		  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		  crossorigin="anonymous">
</head>
<body class="bg-light">
	<main class="container py-5">
		<div class="row justify-content-center">
			<div class="col-md-6 col-lg-5">
				<h1 class="h3 mb-4 text-center">Create account</h1>

				<form th:action="@{/signup}" th:object="${registrationForm}" method="post"
					  class="card shadow-sm" novalidate>
					<div class="card-body">
						<div class="mb-3">
							<label for="email" class="form-label">Email</label>
							<input type="text" inputmode="email" class="form-control" id="email" th:field="*{email}"
								   autocomplete="username" required
								   th:class="${#fields.hasErrors('email')} ? 'form-control is-invalid' : 'form-control'">
							<div th:if="${#fields.hasErrors('email')}" class="invalid-feedback d-block"
								 th:errors="*{email}">Invalid email</div>
						</div>
						<div class="mb-3">
							<label for="password" class="form-label">Password</label>
							<input type="password" class="form-control" id="password" th:field="*{password}"
								   autocomplete="new-password" required
								   th:class="${#fields.hasErrors('password')} ? 'form-control is-invalid' : 'form-control'">
							<div th:if="${#fields.hasErrors('password')}" class="invalid-feedback d-block"
								 th:errors="*{password}">Invalid password</div>
						</div>
						<button type="submit" class="btn btn-primary w-100">Create account</button>
					</div>
				</form>

				<p class="text-center mt-3 mb-0">
					Already have an account? <a th:href="@{/login}" href="/login">Sign in</a>
				</p>
			</div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
			crossorigin="anonymous"></script>
</body>
</html>
