# Production profile (Render). Activated via SPRING_PROFILES_ACTIVE=prod.
# Secrets come ONLY from the runtime environment (Render env vars) - never commit values.

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Flyway owns DDL; Hibernate only validates the entity<->schema mapping.
# Never use 'update' once entities exist - it would mutate the Neon schema out from under Flyway.
spring.jpa.hibernate.ddl-auto=validate

# Flyway must run through Neon's DIRECT (non-pooler) endpoint: PgBouncer transaction
# pooling breaks Flyway's session-level advisory locks and DDL. Runtime queries stay on
# the pooled SPRING_DATASOURCE_URL. No fallback: an unset SPRING_FLYWAY_URL fails fast at
# startup rather than silently migrating through the pooler.
spring.flyway.url=${SPRING_FLYWAY_URL}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD}

# Defense-in-depth: never expose the H2 console in prod.
spring.h2.console.enabled=false

# Hikari sizing for Neon free tier (autosuspends after ~5 min idle).
# initialization-fail-timeout=-1 lets the app boot while Neon's compute is waking.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=300000

# Cap thread-stack memory to fit the 512 MB Render container (see Dockerfile JVM flags).
server.tomcat.threads.max=50
