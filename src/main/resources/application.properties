spring.application.name=nextslope

# Local datasource: in-memory H2 in PostgreSQL-compatibility mode so the same
# Flyway migration set that targets Neon Postgres applies identically here.
# DB_CLOSE_DELAY=-1 keeps the schema alive for the app's whole lifetime.
spring.datasource.url=jdbc:h2:mem:nextslope;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Enable the H2 web console locally (prod pins this to false). Without it the
# console servlet is never registered and the /h2-console/** security chain is dead.
spring.h2.console.enabled=true

# Flyway owns DDL; Hibernate only validates the entity<->schema mapping.
spring.jpa.hibernate.ddl-auto=validate

# Render injects PORT (default 10000); fall back to 8080 for local dev.
server.port=${PORT:8080}

# Build correct https scheme/redirects behind Render's TLS-terminating proxy.
server.forward-headers-strategy=framework

# Health is the default exposed actuator endpoint; declared explicitly as documentation.
# show-details defaults to "never", so the public body is just {"status":"UP"}.
management.endpoints.web.exposure.include=health
