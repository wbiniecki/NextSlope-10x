# Local-only profile, activated by `./gradlew bootRun` (see build.gradle).
# Overrides the in-memory default with a file-backed H2 so accounts and other
# data survive app restarts (including spring-boot-devtools reloads) during
# manual testing. Tests and CI use the base application.properties (in-memory)
# and are intentionally unaffected. The DB files live under ./data/ (gitignored).
spring.datasource.url=jdbc:h2:file:./data/nextslope;MODE=PostgreSQL;DB_CLOSE_DELAY=-1

# Local-only opt-in for deterministic admin bootstrap credentials.
nextslope.dev-admin.enabled=true
